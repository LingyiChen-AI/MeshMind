[package]
name = "meshmind"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meshmind-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# 更新装完必须重启应用才生效，relaunch() 由 process 插件提供。
tauri-plugin-process = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 关掉默认特性并改用 rustls：默认的 native-tls 会在 Windows 上引入
# OpenSSL 构建依赖，CI 会直接红。
# 用 blocking 而不是异步流：外壳没有 async runtime，为 AI 单独引入一个太重；
# blocking::Response 实现了 Read，边读边分帧就是流式。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"
# tauri 的 test 特性只在测试构建里启用，用于 mock runtime 跑真实 IPC 往返。
tauri = { version = "2", features = ["test"] }
