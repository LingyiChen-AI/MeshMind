name: CI

# 触发条件：
# - push 到 main：合并后的完整验证（含打包）
# - pull_request：改动的快速验证（不打包，见下方 bundle 步骤的注释）
# - workflow_dispatch：需要手动出安装包时用
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上的新提交会取消旧的运行，避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 里不需要增量编译产物，关掉能省缓存体积
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂掉不影响另一个平台跑完，双平台问题要一次看全
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # tauri.conf.json 里 bundle.targets 同时写了 dmg 和 msi，
            # 但 msi 只能在 Windows 上打，dmg 只能在 macOS 上打（无法交叉构建），
            # 所以这里按平台显式指定 --bundles，避免撞上不支持的目标。
            bundles: dmg
          - os: windows-latest
            bundles: msi

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 必须在 setup-node 之前，否则 setup-node 的 pnpm 缓存找不到 pnpm 可执行文件
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存 cargo registry 与 target/，按 matrix.os 天然隔离
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # 注：rusqlite 用的是 bundled 特性，会用 cc 编译内置的 SQLite 源码，
      # 因此构建机上必须有 C 编译器。
      # - windows-latest 镜像自带 Visual Studio Build Tools（MSVC cl.exe + Windows SDK），
      #   且默认 target 是 x86_64-pc-windows-msvc，cc crate 能直接找到，**不需要**额外装
      #   LLVM/MinGW，也不需要 ilammy/msvc-dev-cmd 这类步骤。
      # - macos-latest 自带 Xcode Command Line Tools 的 clang，同样无需额外步骤。
      # 若将来换成 GNU toolchain 或加了 Linux runner，才需要单独准备编译器。

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端单元测试
        run: pnpm test

      - name: 前端类型检查与构建
        run: pnpm build

      # --locked：Cargo.lock 与 manifest 不一致时立刻失败，
      # 而不是让 CI 悄悄改 lockfile 后照样通过（本项目踩过一次 lockfile 未提交）。
      - name: Rust 测试
        run: cargo test --workspace --locked

      - name: Clippy（warning 视为错误）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 格式检查
        run: cargo fmt --all -- --check

      # 打包每个平台要十几分钟（Tauri 需要 release 模式全量编译 Rust 依赖），
      # 在每个 PR 的每次 push 上都跑性价比太低，而且打包失败几乎都源于
      # 配置/图标/签名这类不随业务代码变化的问题。
      # 取舍：PR 上只跑测试与 lint（快速反馈），打包放到 push 到 main
      # 和手动触发（workflow_dispatch）时跑，保证 main 始终是可出包的。
      # 如果某个 PR 确实改了打包相关配置，用 workflow_dispatch 手动跑一次即可。
      - name: 打包安装程序
        if: github.event_name != 'pull_request'
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: 上传安装包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: meshmind-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
